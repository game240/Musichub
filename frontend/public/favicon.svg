<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    :root {
      --rim-color: #4f46e5;
      --groove-color: #5e6ad2;
      --label-color: #4f46e5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --rim-color: #818cf8;
        --groove-color: #a5b4fc;
        --label-color: #818cf8;
      }
    }
    .rim { stroke: var(--rim-color); }
    .groove { stroke: var(--groove-color); }
    .label { fill: var(--label-color); }
  </style>

  <!-- Outer Rim -->
  <circle cx="16" cy="16" r="13.2" class="rim" stroke-width="2.6"/>

  <!-- Disc3 Signature Grooves -->
  <path d="M8.6 16a7.4 7.4 0 0 1 2.2-5.2" class="groove" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M23.4 16a7.4 7.4 0 0 1-2.2 5.2" class="groove" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Center Label with Transparent Spindle Cutout -->
  <path fill-rule="evenodd" clip-rule="evenodd" d="M16 11.8a4.2 4.2 0 1 0 0 8.4 4.2 4.2 0 0 0 0-8.4zm0 2.6a1.6 1.6 0 1 1 0 3.2 1.6 1.6 0 0 1 0-3.2z" class="label"/>
</svg>
